[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps = 
	bolderflight/Bolder Flight Systems SBUS@^8.1.4
	zerokol/eFLL@^1.4.1
	duracopter/MAVLink v2 C library@^2.0
