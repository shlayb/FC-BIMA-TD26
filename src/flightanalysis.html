<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Flight Analyzer Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0e27;
  --bg-card: #141b3d;
  --accent-primary: #00d9ff;
  --accent-secondary: #7b2ff7;
  --text-primary: #ffffff;
  --text-secondary: #a0aec0;
  --success: #00ff88;
  --warning: #ffd700;
  --danger: #ff3366;
  --border: rgba(255,255,255,0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Work Sans', sans-serif;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 100%);
  color: var(--text-primary);
  overflow: hidden;
}

/* Animated background */
.bg-animation {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 0.03;
  background: 
    radial-gradient(circle at 20% 30%, var(--accent-primary) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, var(--accent-secondary) 0%, transparent 50%);
  animation: pulse 8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.03; transform: scale(1); }
  50% { opacity: 0.06; transform: scale(1.1); }
}

/* Header */
#header {
  position: relative;
  z-index: 1000;
  background: rgba(10, 14, 39, 0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}

.header-content {
  max-width: 1800px;
  margin: 0 auto;
  padding: 20px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
  animation: slideInLeft 0.6s ease;
}

.brand-icon {
  width: 45px;
  height: 45px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.brand-text h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}

.brand-text p {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* Upload Controls */
.upload-controls {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  animation: slideInRight 0.6s ease;
}

.file-input-wrapper {
  position: relative;
}

.file-input-wrapper input[type="file"] {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

.file-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 24px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 12px;
  color: var(--text-primary);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Work Sans', sans-serif;
  font-size: 14px;
}

.file-btn:hover {
  border-color: var(--accent-primary);
  background: rgba(0, 217, 255, 0.1);
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(0, 217, 255, 0.2);
}

.file-btn.loaded {
  border-color: var(--success);
  background: rgba(0, 255, 136, 0.1);
}

.file-btn-icon {
  font-size: 18px;
}

/* Stats Panel */
#statsPanel {
  position: absolute;
  top: 100px;
  right: 20px;
  z-index: 900;
  background: rgba(20, 27, 61, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  min-width: 280px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  animation: slideInRight 0.6s ease 0.3s both;
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-30px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

.stats-header {
  font-family: 'Orbitron', sans-serif;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 15px;
  color: var(--accent-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.stat-row:last-child {
  border-bottom: none;
}

.stat-label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 400;
}

.stat-value {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}

.stat-value.highlight {
  color: var(--accent-primary);
}

/* Legend */
#legend {
  position: absolute;
  bottom: 30px;
  left: 30px;
  z-index: 900;
  background: rgba(20, 27, 61, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  min-width: 250px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  animation: slideInLeft 0.6s ease 0.3s both;
}

.legend-header {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--accent-primary);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  font-size: 13px;
  color: var(--text-secondary);
}

.legend-line {
  width: 30px;
  height: 3px;
  border-radius: 2px;
}

.legend-marker {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid white;
}

/* Map Container */
#map {
  height: 100vh;
  position: relative;
  z-index: 1;
}

.leaflet-container {
  background: #0a0e27;
}

/* Custom Map Labels */
.wpLabel {
  background: linear-gradient(135deg, #fff, #f0f0f0);
  border: 2px solid #333;
  border-radius: 8px;
  padding: 4px 10px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: #000;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  text-align: center;
}

.modeLabel {
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 12px;
  padding: 6px 14px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: white;
  box-shadow: 0 4px 16px rgba(0, 217, 255, 0.5);
  text-align: center;
  animation: labelPulse 2s ease-in-out infinite;
  white-space: nowrap;
}

.modeLabel.start {
  background: linear-gradient(135deg, #00ff88, #00d9ff);
  box-shadow: 0 4px 16px rgba(0, 255, 136, 0.6);
}

.modeLabel.end {
  background: linear-gradient(135deg, #ff3366, #ff6699);
  box-shadow: 0 4px 16px rgba(255, 51, 102, 0.6);
}

@keyframes labelPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* Waypoint Pin Icon */
.wpPin {
  background: transparent;
  border: none;
  text-align: center;
  font-size: 32px;
  line-height: 1;
  filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.5));
  animation: wpBounce 1.5s ease-in-out infinite;
}

.wpPin::after {
  content: '';
  display: block;
  width: 24px;
  height: 24px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: 50%;
  margin: -8px auto 0;
  border: 3px solid white;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}

@keyframes wpBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

.wpNumber {
  background: white;
  border: 2px solid var(--accent-primary);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 11px;
  color: var(--accent-primary);
  box-shadow: 0 3px 10px rgba(0, 217, 255, 0.4);
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
}

/* Toast Notifications */
#toast {
  position: fixed;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  background: rgba(20, 27, 61, 0.98);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 24px;
  min-width: 300px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  display: none;
  animation: slideDown 0.3s ease;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

#toast.show {
  display: block;
}

#toast.success {
  border-color: var(--success);
}

#toast.error {
  border-color: var(--danger);
}

.toast-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.toast-icon {
  font-size: 20px;
}

.toast-text {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
}

/* Loading Spinner */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 768px) {
  .header-content {
    padding: 15px 20px;
  }
  
  .brand-text h1 {
    font-size: 20px;
  }
  
  #statsPanel {
    top: auto;
    bottom: 100px;
    right: 10px;
    left: 10px;
    min-width: auto;
  }
  
  #legend {
    bottom: 10px;
    left: 10px;
    right: 10px;
    min-width: auto;
  }
}
</style>
</head>
<body>
<div class="bg-animation"></div>

<div id="header">
  <div class="header-content">
    <div class="brand">
      <div class="brand-icon">✈️</div>
      <div class="brand-text">
        <h1>FLIGHT ANALYZER</h1>
        <p>Advanced Telemetry Visualization</p>
      </div>
    </div>
    
    <div class="upload-controls">
      <div class="file-input-wrapper">
        <div class="file-btn" id="csvBtn">
          <span class="file-btn-icon">📊</span>
          <span id="csvLabel">Load Flight Data</span>
        </div>
        <input type="file" id="csvInput" accept=".csv">
      </div>
      
      <div class="file-input-wrapper">
        <div class="file-btn" id="wpBtn">
          <span class="file-btn-icon">📍</span>
          <span id="wpLabel">Load Waypoints</span>
        </div>
        <input type="file" id="wpInput" accept=".waypoints,.txt">
      </div>
    </div>
  </div>
</div>

<div id="statsPanel" style="display:none;">
  <div class="stats-header">
    <span>📈</span>
    <span>FLIGHT STATISTICS</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Auto Mode Points</span>
    <span class="stat-value highlight" id="autoPoints">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Manual Mode Points</span>
    <span class="stat-value" id="manualPoints">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Waypoints Reached</span>
    <span class="stat-value" id="wpCount">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Total Data Points</span>
    <span class="stat-value" id="totalPoints">0</span>
  </div>
</div>

<div id="legend" style="display:none;">
  <div class="legend-header">LEGEND</div>
  <div class="legend-item">
    <div class="legend-line" style="background: linear-gradient(90deg, #ff3366, #ff6699);"></div>
    <span>Auto Mode Path</span>
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background: linear-gradient(90deg, #00d9ff, #7b2ff7); opacity: 0.6;"></div>
    <span>Manual Mode Path</span>
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background: #00d9ff; border: 2px dashed rgba(255,255,255,0.5);"></div>
    <span>Planned Waypoints</span>
  </div>
  <div class="legend-item">
    <span style="font-size: 20px;">🚀</span>
    <span>Start Point</span>
  </div>
  <div class="legend-item">
    <span style="font-size: 20px;">🏁</span>
    <span>End Point</span>
  </div>
  <div class="legend-item">
    <span style="font-size: 20px;">📍</span>
    <span>Waypoint Markers</span>
  </div>
</div>

<div id="toast">
  <div class="toast-content">
    <span class="toast-icon" id="toastIcon"></span>
    <span class="toast-text" id="toastText"></span>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Initialize map
const map = L.map('map', {
  zoomControl: true,
  attributionControl: true
}).setView([-7.767, 110.233], 15);

// Dark themed tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

let autoLine = null, manualLine = null, wpLine = null;
let wpMarkers = [], autoMarkers = [];
let csvLoaded = false, wpLoaded = false;

// Toast notification
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const text = document.getElementById('toastText');
  
  toast.className = `show ${type}`;
  icon.textContent = type === 'success' ? '✅' : '❌';
  text.textContent = message;
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

// File input handlers
document.getElementById('csvBtn').addEventListener('click', () => {
  document.getElementById('csvInput').click();
});

document.getElementById('wpBtn').addEventListener('click', () => {
  document.getElementById('wpInput').click();
});

document.getElementById('csvInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    document.getElementById('csvLabel').innerHTML = '<span class="spinner"></span> Loading...';
    loadCSV(file);
  }
});

document.getElementById('wpInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    document.getElementById('wpLabel').innerHTML = '<span class="spinner"></span> Loading...';
    loadWP(file);
  }
});

function loadCSV(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    parseCSV(e.target.result);
    csvLoaded = true;
    document.getElementById('csvBtn').classList.add('loaded');
    document.getElementById('csvLabel').textContent = file.name;
    showToast('Flight data loaded successfully!', 'success');
  };
  r.onerror = () => {
    showToast('Error loading CSV file', 'error');
    document.getElementById('csvLabel').textContent = 'Load Flight Data';
  };
  r.readAsText(file);
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  if (lines.length < 2) {
    showToast('Invalid CSV file', 'error');
    return;
  }
  
  const h = lines[0].split(',');
  const latI = h.indexOf('latitude');
  const lonI = h.indexOf('longitude');
  const modeI = h.indexOf('mode');
  const wpI = h.indexOf('wpCount');

  let auto = [], manual = [], wpEvents = [];
  let lastWp = null;
  
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const c = lines[i].split(',');
    const lat = parseFloat(c[latI]);
    const lon = parseFloat(c[lonI]);
    const mode = c[modeI];
    
    if (isNaN(lat) || isNaN(lon)) continue;
    
    if (mode === 'AUTO') {
      auto.push([lat, lon]);
      const wp = parseInt(c[wpI]);
      if (!isNaN(wp) && wp !== lastWp) {
        wpEvents.push({pos: [lat, lon], wp});
        lastWp = wp;
      }
    } else {
      manual.push([lat, lon]);
    }
  }

  drawFlight(auto, manual, wpEvents);
  updateStats(auto.length, manual.length, wpEvents.length, auto.length + manual.length);
}

function drawFlight(auto, manual, wpEvents) {
  // Clear previous layers
  if (autoLine) map.removeLayer(autoLine);
  if (manualLine) map.removeLayer(manualLine);
  autoMarkers.forEach(m => map.removeLayer(m));
  autoMarkers = [];

  // Draw manual mode path
  if (manual.length > 1) {
    manualLine = L.polyline(manual, {
      weight: 3,
      color: '#00d9ff',
      opacity: 0.5,
      smoothFactor: 1
    }).addTo(map);
  }

  // Draw auto mode path
  if (auto.length > 1) {
    autoLine = L.polyline(auto, {
      weight: 4,
      color: '#ff3366',
      opacity: 0.9,
      smoothFactor: 1
    }).addTo(map);

    // Add START marker - more prominent
    const startIcon = L.divIcon({
      className: 'modeLabel start',
      html: '🚀 START',
      iconSize: [80, 32],
      iconAnchor: [40, 16]
    });
    const startMarker = L.marker(auto[0], {icon: startIcon}).addTo(map);
    startMarker.bindPopup('<b>Flight Start</b><br>First AUTO mode point');
    autoMarkers.push(startMarker);

    // Add waypoint markers along the path
    wpEvents.forEach((e, i) => {
      // Create a map pin icon with the WP number
      const wpIcon = L.divIcon({
        className: 'wpPin',
        html: `📍<div class="wpNumber">${e.wp}</div>`,
        iconSize: [40, 50],
        iconAnchor: [20, 45]
      });
      
      const wpMarker = L.marker(e.pos, {icon: wpIcon}).addTo(map);
      wpMarker.bindPopup(`<b>Waypoint ${e.wp}</b><br>Lat: ${e.pos[0].toFixed(6)}<br>Lon: ${e.pos[1].toFixed(6)}`);
      autoMarkers.push(wpMarker);
    });

    // Add END marker - more prominent
    const endIcon = L.divIcon({
      className: 'modeLabel end',
      html: '🏁 END',
      iconSize: [70, 32],
      iconAnchor: [35, 16]
    });
    const endMarker = L.marker(auto[auto.length - 1], {icon: endIcon}).addTo(map);
    endMarker.bindPopup('<b>Flight End</b><br>Last AUTO mode point');
    autoMarkers.push(endMarker);
  }

  // Fit map to show all data
  const all = [...auto, ...manual];
  if (all.length) {
    map.fitBounds(L.latLngBounds(all), {padding: [50, 50]});
  }
  
  // Show legend
  document.getElementById('legend').style.display = 'block';
}

function updateStats(autoCount, manualCount, wpCount, totalCount) {
  document.getElementById('autoPoints').textContent = autoCount;
  document.getElementById('manualPoints').textContent = manualCount;
  document.getElementById('wpCount').textContent = wpCount;
  document.getElementById('totalPoints').textContent = totalCount;
  document.getElementById('statsPanel').style.display = 'block';
}

function loadWP(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    parseWP(e.target.result);
    wpLoaded = true;
    document.getElementById('wpBtn').classList.add('loaded');
    document.getElementById('wpLabel').textContent = file.name;
    showToast('Waypoints loaded successfully!', 'success');
  };
  r.onerror = () => {
    showToast('Error loading waypoint file', 'error');
    document.getElementById('wpLabel').textContent = 'Load Waypoints';
  };
  r.readAsText(file);
}

function parseWP(text) {
  const lines = text.split(/\r?\n/);
  if (!lines[0].includes('QGC WPL')) {
    showToast('Invalid waypoint file format', 'error');
    return;
  }

  let pts = [], meta = [];
  
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const c = lines[i].split(/\t+/);
    if (c.length < 12) continue;
    
    const seq = parseInt(c[0]);
    const isHome = parseInt(c[1]) === 1 || seq === 0;
    const lat = parseFloat(c[8]);
    const lon = parseFloat(c[9]);
    
    if (!isNaN(lat) && !isNaN(lon)) {
      pts.push([lat, lon]);
      meta.push({seq, isHome});
    }
  }

  drawWP(pts, meta);
}

function drawWP(pts, meta) {
  // Clear previous waypoint layers
  if (wpLine) map.removeLayer(wpLine);
  wpMarkers.forEach(m => map.removeLayer(m));
  wpMarkers = [];

  if (pts.length < 2) return;

  // Draw waypoint path
  wpLine = L.polyline(pts, {
    color: '#00d9ff',
    dashArray: '10, 10',
    weight: 3,
    opacity: 0.7
  }).addTo(map);

  // Add waypoint markers
  pts.forEach((p, i) => {
    const label = meta[i].isHome ? 'H' : meta[i].seq;
    const icon = L.divIcon({
      className: 'wpLabel',
      html: label,
      iconSize: [30, 26]
    });
    const m = L.marker(p, {icon}).addTo(map);
    wpMarkers.push(m);
  });

  map.fitBounds(wpLine.getBounds(), {padding: [50, 50]});
}
