<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Flight Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif}
#topbar{padding:10px;background:#111;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#map{height:calc(100vh - 60px)}
input{color:white}
.info{opacity:.8;font-size:14px}
.wpLabel{background:#fff;border:1px solid #000;border-radius:6px;padding:2px 6px;font-weight:bold}
.modeLabel{background:#fffa;border:1px solid #000;border-radius:6px;padding:2px 6px;font-weight:bold}
</style>
</head>
<body>
<div id="topbar">
<b>Flight Analyzer</b>
<label>Flight CSV <input type="file" id="csvInput" accept=".csv"></label>
<label>Waypoints <input type="file" id="wpInput" accept=".waypoints,.txt"></label>
<span id="status" class="info">Load flight log</span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([-7.767,110.233],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

let autoLine=null,manualLine=null,wpLine=null,wpMarkers=[],autoMarkers=[];

document.getElementById('csvInput').addEventListener('change',e=>loadCSV(e.target.files[0]));
document.getElementById('wpInput').addEventListener('change',e=>loadWP(e.target.files[0]));

function loadCSV(file){if(!file)return;const r=new FileReader();r.onload=e=>parseCSV(e.target.result);r.readAsText(file);} 

function parseCSV(text){
const lines=text.split(/\r?\n/);if(lines.length<2)return;
const h=lines[0].split(',');
const latI=h.indexOf('latitude');
const lonI=h.indexOf('longitude');
const modeI=h.indexOf('mode');
const wpI=h.indexOf('wpCount');

let auto=[],manual=[],wpEvents=[];
let lastWp=null;
for(let i=1;i<lines.length;i++){
if(!lines[i].trim())continue;
const c=lines[i].split(',');
const lat=parseFloat(c[latI]);
const lon=parseFloat(c[lonI]);
const mode=c[modeI];
if(isNaN(lat)||isNaN(lon))continue;
if(mode==='AUTO'){
  auto.push([lat,lon]);
  const wp=parseInt(c[wpI]);
  if(!isNaN(wp) && wp!==lastWp){
    wpEvents.push({pos:[lat,lon],wp});
    lastWp=wp;
  }
} else manual.push([lat,lon]);
}

drawFlight(auto,manual,wpEvents);
}

function drawFlight(auto,manual,wpEvents){
if(autoLine)map.removeLayer(autoLine);
if(manualLine)map.removeLayer(manualLine);
autoMarkers.forEach(m=>map.removeLayer(m));autoMarkers=[];

if(manual.length>1)manualLine=L.polyline(manual,{weight:3,color:'blue',opacity:0.5}).addTo(map);
if(auto.length>1){
  autoLine=L.polyline(auto,{weight:4,color:'red'}).addTo(map);

  const startIcon=L.divIcon({className:'modeLabel',html:'START'});
  const endIcon=L.divIcon({className:'modeLabel',html:'END'});
  autoMarkers.push(L.marker(auto[0],{icon:startIcon}).addTo(map));
  autoMarkers.push(L.marker(auto[auto.length-1],{icon:endIcon}).addTo(map));

  wpEvents.forEach((e,i)=>{
    // offset marker perpendicular to path so it doesn't overlap line
    let p=e.pos;
    if(auto.length>2){
      const idx=Math.min(i,auto.length-2);
      const a=auto[idx];
      const b=auto[idx+1];
      const dx=b[1]-a[1];
      const dy=b[0]-a[0];
      const len=Math.sqrt(dx*dx+dy*dy)||1;
      const offLat=p[0]+(dx/len)*0.00005;
      const offLon=p[1]-(dy/len)*0.00005;
      p=[offLat,offLon];
    }
    const icon=L.divIcon({className:'modeLabel',html:'WP '+e.wp});
    autoMarkers.push(L.marker(p,{icon}).addTo(map));
  });
}

const all=[...auto,...manual];
if(all.length)map.fitBounds(L.latLngBounds(all),{padding:[20,20]});

document.getElementById('status').textContent=`AUTO pts: ${auto.length} | Other pts: ${manual.length}`;
}

function loadWP(file){if(!file)return;const r=new FileReader();r.onload=e=>parseWP(e.target.result);r.readAsText(file);} 

function parseWP(text){
const lines=text.split(/\r?\n/);
if(!lines[0].includes('QGC WPL')){alert('Invalid waypoint file');return;}

let pts=[];let meta=[];
for(let i=1;i<lines.length;i++){
if(!lines[i].trim())continue;
const c=lines[i].split(/\t+/);
if(c.length<12)continue;
const seq=parseInt(c[0]);
const isHome=parseInt(c[1])===1 || seq===0;
const lat=parseFloat(c[8]);
const lon=parseFloat(c[9]);
if(!isNaN(lat)&&!isNaN(lon)){pts.push([lat,lon]);meta.push({seq,isHome});}
}

drawWP(pts,meta);
}

function drawWP(pts,meta){
if(wpLine)map.removeLayer(wpLine);
wpMarkers.forEach(m=>map.removeLayer(m));
wpMarkers=[];

if(pts.length<2)return;

wpLine=L.polyline(pts,{color:'blue',dashArray:'8,8',weight:3}).addTo(map);

pts.forEach((p,i)=>{
const label=meta[i].isHome?'H':meta[i].seq;
const icon=L.divIcon({className:'wpLabel',html:label});
const m=L.marker(p,{icon}).addTo(map);
wpMarkers.push(m);
});

map.fitBounds(wpLine.getBounds(),{padding:[20,20]});
}
</script>
</body>
</html>
